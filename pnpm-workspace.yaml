allowBuilds:
  # Both arrived with next-intl and both ship prebuilt binaries for every platform this project
  # builds on; their install scripts are only the compile-from-source fallback. @parcel/watcher is
  # used by next-intl's dev-time message watcher and never at build time.
  '@parcel/watcher': false
  '@sentry/cli': true
  '@swc/core': false
  # Both only print a funding banner on install; nothing is compiled.
  core-js: false
  es5-ext: false
  esbuild: true
  supabase: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.102.8'
  - '@tanstack/react-query@5.102.8'
  - lint-staged@17.4.1
  - pdfjs-dist@6.3.289
