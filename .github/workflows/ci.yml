name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Local-dev Supabase defaults. Not secrets — the same values ship in .env.example — but the app
  # validates them at boot (lib/env.ts), so the build needs them present.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-0000000000000000000000000
  NEXT_PUBLIC_ENV: preview
  NEXT_TELEMETRY_DISABLED: '1'
  # Serves the /dev design harness so the end-to-end suite can exercise the note renderer against
  # a real production build. Workflow-level on purpose: `opennextjs-cloudflare build` runs its own
  # `next build` and overwrites .next, so setting this on the Build step alone left Playwright
  # serving a bundle with the harness compiled out — every /dev route 404'd and 31 tests timed out.
  # The deploy workflow does not set it, so the live site still has no such page.
  NEXT_PUBLIC_DEV_SCREENS: '1'

jobs:
  build:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    # The job gained the Storybook accessibility run (117 stories in a real browser) on top of
    # build, OpenNext build, Playwright, and now two Lighthouse suites — desktop and mobile — of
    # three passes over two URLs each.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Validate curriculum packs
        run: |
          pnpm pack:validate
          pnpm pack:validate curriculum-authoring/pack.template.json

      - name: Build
        run: pnpm build

      # Runs after the build so it can inspect the real client chunks, not just the source.
      - name: No secrets in the client bundle
        run: pnpm test:bundle

      # The marketing routes have a first-load JavaScript ceiling (02-ARCHITECTURE.md §8). The
      # number is printed by `next build`, and a number printed in a log nobody reads is not a
      # budget — the demo embed and the maths libraries are one careless static import away.
      - name: First-load JS budget
        run: pnpm test:budget

      - name: OpenNext (Cloudflare) build
        run: pnpm cf:build

      # Asks the *real* worker, in workerd, for every public URL. Nothing else in this pipeline
      # can: Playwright and Lighthouse both run against `next start`, which reads Next's prerender
      # cache off the filesystem. The worker cannot, and serves prerendered pages of dynamic routes
      # from an incremental cache instead — which is how all five /zh pages once shipped as 404s
      # with every other check in this file green.
      - name: Worker serves every route
        run: pnpm check:worker

      # The Worker has a hard 3 MiB gzipped ceiling on the free plan and it is the tightest budget
      # in this project. Phase-03 sailed past it — the parsers took it to 3742 KiB — and the only
      # thing that noticed was `wrangler deploy`, at the end of a pull request that was already
      # green. The fix lives in one block of `next.config.ts` and is easy to undo by accident.
      - name: Worker fits the free-plan ceiling
        run: pnpm check:worker:size

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      # The phase-01 gate: axe over every story, in a real browser. Without this the
      # accessibility bar is a convention rather than a check.
      - name: Storybook accessibility
        run: pnpm test:stories

      - name: Playwright smoke
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Lighthouse budget (desktop)
        run: pnpm exec lhci autorun --config=lighthouserc.cjs

      # The definition of done asks for LCP under 1.8s on emulated 4G, which is a *mobile*
      # condition the desktop preset above was never testing. The config carries the throttling
      # profile and the reasoning behind it.
      - name: Lighthouse budget (mobile, emulated 4G)
        run: pnpm exec lhci autorun --config=lighthouserc.mobile.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: |
            .lighthouseci/
            .lighthouseci-mobile/
          retention-days: 7

  ai-evals:
    name: AI evals (mock provider)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Never hits a real provider: the release gate must not cost money or depend on an API
      # being up. The nightly run against the live key arrives with the pipeline in phase-04.
      - name: Run evals
        run: pnpm test:ai

  supabase:
    name: Supabase — migrations, types and the guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`.
          #
          # `latest` resolves through the GitHub releases API on every run, and shared runners hit
          # its rate limit — which failed Deploy on `main` after a docs-only commit, with a red
          # check that had nothing to do with the change. Pinning also means CI runs the same CLI
          # as `pnpm exec supabase` locally, because this is the version in `package.json`.
          # Bump both together.
          version: 2.116.0

      # The edge functions import lib/ai directly, and Deno resolves module specifiers literally.
      # A type error there fails at *deploy* rather than at typecheck, so it gets its own check —
      # `tsc` excludes supabase/functions because it cannot see the Deno globals.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck the edge functions
        run: pnpm check:edge

      # Applies both migrations to a clean local Postgres, so a migration that does not apply
      # cannot merge.
      - name: Start local stack
        run: supabase start

      - name: Verify migrations apply from scratch
        run: supabase db reset

      - name: Row-level security isolation
        run: pnpm test:rls

      - name: Offline conflict preservation
        run: pnpm test:sync

      # The three-layer cost ceiling is a claim about auth, Postgres, a streaming response and a
      # ledger write all agreeing, and the only way to check it is to drive the real functions
      # until they refuse. The provider is `supabase/functions/test-provider`, scripted and free.
      - name: Serve the functions
        run: |
          supabase functions serve --no-verify-jwt --env-file supabase/functions/.env.test &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://127.0.0.1:54321/functions/v1/usage && break || sleep 1
          done

      - name: Guardrail integration tests
        run: node scripts/test-edge.mjs

      - name: Account deletion integration test
        run: pnpm test:account-delete
