name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Local-dev Supabase defaults. Not secrets — the same values ship in .env.example — but the app
  # validates them at boot (lib/env.ts), so the build needs them present.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-0000000000000000000000000
  NEXT_PUBLIC_ENV: preview
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Validate curriculum packs
        run: |
          pnpm pack:validate
          pnpm pack:validate curriculum-authoring/pack.template.json

      - name: Build
        run: pnpm build
        env:
          # Lets the Playwright suite reach the /dev design harness in a production build. The
          # deploy workflow does not set it, so the live site still 404s those routes.
          NEXT_PUBLIC_DEV_SCREENS: '1'

      # Runs after the build so it can inspect the real client chunks, not just the source.
      - name: No secrets in the client bundle
        run: pnpm test:bundle

      - name: OpenNext (Cloudflare) build
        run: pnpm cf:build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Playwright smoke
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Lighthouse budget
        run: pnpm exec lhci autorun --config=lighthouserc.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

  ai-evals:
    name: AI evals (mock provider)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Never hits a real provider: the release gate must not cost money or depend on an API
      # being up. The nightly run against the live key arrives with the pipeline in phase-04.
      - name: Run evals
        run: pnpm test:ai

  supabase:
    name: Supabase migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies 0000_init.sql to a clean local Postgres, so a migration that does not apply
      # cannot merge.
      - name: Start local stack
        run: supabase start

      - name: Verify migrations apply from scratch
        run: supabase db reset

      - name: Verify each edge function stub responds 501
        run: |
          supabase functions serve --no-verify-jwt &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:54321/functions/v1/enhance && break || sleep 1
          done
          fail=0
          for fn in enhance ocr notion-oauth notion-push drive-auth drive-push cron-keepalive; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              "http://127.0.0.1:54321/functions/v1/$fn")
            echo "$fn -> $code"
            [ "$code" = "501" ] || fail=1
          done
          exit $fail
