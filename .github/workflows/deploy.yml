name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Preview' || 'Production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    env:
      # Fallbacks keep the very first deploy working before any repo variables are set. There is
      # no production Supabase project until phase-06, and nothing calls it before then; once one
      # exists, set these as repo variables and the fallbacks stop being used.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54321' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-until-phase-06-0000000000' }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://lumen.marvinmaiwang.workers.dev' }}
      NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME || 'Lumen' }}
      NEXT_PUBLIC_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_SENTRY_ENABLED: ${{ vars.NEXT_PUBLIC_SENTRY_ENABLED }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.NEXT_PUBLIC_CF_ANALYTICS_TOKEN }}
      NEXT_PUBLIC_ANALYTICS_BEACON_URL: ${{ vars.NEXT_PUBLIC_ANALYTICS_BEACON_URL }}

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build worker
        run: pnpm cf:build

      # Production deploys to the live worker; a PR deploys to a per-branch preview URL.
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            ${{ github.event_name == 'pull_request'
              && format('versions upload --preview-alias pr-{0}', github.event.number)
              || 'deploy' }}

      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        # Step-level, not inside `with:` — `env` is a step key, and nesting it under `with` makes
        # the whole workflow fail to parse.
        env:
          APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
        with:
          script: |
            // Derived, not guessed. A preview alias lives at
            // `<alias>-<worker>.<account-subdomain>.workers.dev`, and the account subdomain was
            // missing — so every preview comment so far pointed at a hostname that does not
            // resolve. The production URL already carries the right subdomain, so take it from
            // there: `lumen.acme.workers.dev` → `pr-7-lumen.acme.workers.dev`.
            const host = new URL(process.env.APP_URL).host;
            const [worker, ...rest] = host.split('.');
            const url = `https://pr-${context.issue.number}-${worker}.${rest.join('.')}`;
            const marker = '<!-- lumen-preview -->';
            const body = `${marker}\n**Preview:** ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

  # ---------------------------------------------------------------------------
  # Supabase — migrations, function secrets and the edge functions.
  #
  # There is one Supabase project, so a pull request's edge functions ARE the live ones from the
  # moment this job runs. That is a real trade and it is made deliberately: the alternative is that
  # no preview can exercise generation at all, and AGENTS.md is emphatic that a green pipeline is
  # not evidence a deployment works. What makes it tolerable is that the guardrails are config
  # rather than code — `enhance_enabled` and both caps are rows in `app_config`, so a bad deploy is
  # stopped from the dashboard in seconds rather than by another deploy. Phase-06, which brings
  # accounts, is where a second project or Supabase branching belongs.
  #
  # The whole job is skipped when the project secrets are absent, which is what a fork sees.
  # ---------------------------------------------------------------------------
  supabase:
    name: Supabase functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Check the project is configured
        id: configured
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "No Supabase project configured — skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.configured.outputs.ready == 'true'
        with:
          version: latest

      - name: Link
        if: steps.configured.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Apply migrations
        if: steps.configured.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Set the function secrets
        if: steps.configured.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set \
            DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            BYOK_ENC_KEY="${{ secrets.BYOK_ENC_KEY }}" \
            ANON_ID_SECRET="${{ secrets.ANON_ID_SECRET }}" \
            TURNSTILE_SECRET="${{ secrets.TURNSTILE_SECRET }}" \
            ALLOWED_ORIGINS="${{ vars.ALLOWED_ORIGINS }}"

      # Named one by one, so `test-provider` — the scripted stand-in the guardrail tests drive —
      # cannot reach production by way of a directory scan. It also refuses to run without
      # ALLOW_TEST_PROVIDER, which is never set here.
      - name: Deploy the functions
        if: steps.configured.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in enhance ask detect ocr usage byok cron-keepalive notion-oauth notion-push drive-auth drive-push; do
            # Signed-out students call these, so the platform's JWT gate has to be off; each
            # function does its own auth (a verified JWT, or a signed anon id behind Turnstile).
            supabase functions deploy "$fn" --no-verify-jwt
          done
